# Image, ports, environment, resources and health check are defined here.
# configuration.yaml ships nginx.conf into the nginx_config volume (it must stay writable so ICP can copy the file in).
services:
  web:
    image: nginx:alpine
    ports:
      - "5555:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - nginx_config:/etc/nginx/conf.d

volumes:
  nginx_config:
