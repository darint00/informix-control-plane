apiVersion: icp/v1
kind: ApplicationConfiguration
spec:
  application:
    name: Analytics Engine Single Node
    version: "8.0.0"
  image:
    repository: repo.dev.actiandatacloud.com:5000/actian/analytics-engine-sn_dev   # dev registry - replace for release
    tag: "8.0.0"
  environment:
    CREATE_DB: db                # database created on first start
    II_INSTALLATION: VW          # installation ID
  ports:
    - name: port-27832
      container: 27832
      host: 27832
    - name: port-27839
      container: 27839
      host: 27839
    - name: port-44223
      container: 44223
      host: 44223
    - name: port-16902
      container: 16902
      host: 16902
  volumes:
    - name: ae-data
      mountPath: /opt/Actian/AnalyticsEngine/ingres/data
    - name: ae-ckp
      mountPath: /opt/Actian/AnalyticsEngine/ingres/ckp
    - name: ae-jnl
      mountPath: /opt/Actian/AnalyticsEngine/ingres/jnl
    - name: ae-log
      mountPath: /opt/Actian/AnalyticsEngine/ingres/log
    - name: ae-files
      mountPath: /opt/Actian/AnalyticsEngine/ingres/files
    - name: udf-log
      mountPath: /opt/Actian/AnalyticsEngine/ingres/udf/log
    - name: udf-import
      mountPath: /opt/Actian/AnalyticsEngine/ingres/udf/import
    - name: spark-provider
      mountPath: /opt/Actian/AnalyticsEngine/ingres/files/spark-provider
  permissions:                   # exceptions to ICP's default manifest policy; honoured only from this catalog file
    container_names: true        # docker-compose.yaml sets container_name (ae, ae-spark, ae-udf)
    host_paths:                  # host directories docker-compose.yaml may bind-mount
      - /home/darint/ACTIAN/GITREPOS/misc
    new_privileges:              # services whose startup uses sudo; ICP otherwise starts containers with no-new-privileges
      - ae
  logging:
    level: info
  settings:
    companion_services:          # run by docker-compose.yaml alongside the primary service "ae"
      - name: spark
        image: actian/analyticsengine8.0-spark-linux:4.3.5
      - name: udf
        image: actian/analyticsengine8.0-udf-linux:1.4.4
