kind: Menu 
spec:
    group:
    - name: GROUP_ONE 
      title: "Group 1" 
      collapsible: true
      items:
      - name: RESOURCES 
        title: "Settings"
        collapsible: true
        description: |
          Resources for Container 
        items:
          - name: CPUS 
            title: "Cpus"
            type: text
            value: "0.5"
          - name: MEMORY 
            title: "Memory"
            type: text
            value: "128m"
    - name: SETTINGS
      title: "Settings"
      collapsible: true
      description: |
        Application-specific settings. ICP does not interpret this section.
      items:
        - name: NOTE 
          title: "Note"
          type: text
          value: "Application-specific settings go here; ICP does not interpret this section."
    - name: LOGGING 
      title: "Logging"
      description: |
        Logging level 
      items:
        - name: LEVEL 
          title: "Level"
          type: text
          value: "info"



