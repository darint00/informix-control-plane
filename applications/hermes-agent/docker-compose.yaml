services:
  agent:
    image: registry.example.com/icp/hermes-agent:latest   # PLACEHOLDER - replace with your Hermes image
    ports:
      - "8083:8080"
    environment:
      HERMES_WORKSPACE: /workspace
    cpus: 2
    mem_limit: 2g
    volumes:
      - hermes-workspace:/workspace

volumes:
  hermes-workspace:
