services:
  agent:
    image: registry.example.com/icp/sample-fastapi-agent:1.0.0   # PLACEHOLDER - replace with your image
    ports:
      - "8082:8000"
    environment:
      AGENT_MODE: assistant
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - agent-data:/data

volumes:
  agent-data:
