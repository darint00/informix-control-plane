kind: Menu 
spec:
    group:
    - name: GROUP_ONE
      title: "Group 1" 
      collapsible: true
      items:
      - name: INSTALL_TYPE 
        title: "Install Type"
        description: |
          Define the type of Storage used for VectorMPP 
        items:
          - name: INSTALL_TYPE_RADIO 
            type: radio 
            default: install_all 
            items:
              - name: install_all 
                title: "Install All"
              - name: custom
                title: Custom 
              - name: debug_hang 
                title: Debug Hang
          - name: INSTALL_CUSTOM_OPTION
            title: Install Custom Options 
            type: text 
            value: "" 
          - name: INSTALL_PORT
            title: Install Port Forward 
            type: text 
            value: "8080" 

      - name: INSTALL_STORAGE
        title: "Install Storage"
        collapsible: true
        description: |
          Define the type of Storage used for VectorMPP 
        items:
          - name:  INSTALL_STOAGE_GCP 
            title: "Install GCP Storage"
            type: text 
            value: "Gcp options" 
          - name: INSTALL_STORAGE_AWS
            title: "Install AWS Storage"
            type: text 
            value: "AWS options" 
      

