services:
  # RustFS: S3-compatible object storage. Endpoint on ae-net: http://rustfs:9000
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    hostname: rustfs
    environment:
      # Local dev defaults only - override via env/.env, never reuse real credentials
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - rustfs-data:/data
    networks:
      - ae-net
    restart: unless-stopped

  # One-shot: create the bucket, then exit
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: rustfs-init
    depends_on:
      - rustfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          echo "waiting for s3..."; sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://${S3_BUCKET:-data} || true
    environment:
      AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - ae-net
    restart: "no"

networks:
  ae-net:
    # Created by the main compose file (project "spark" -> network "spark_ae-net").
    # Start that stack first. If you run it with a different project name (-p /
    # COMPOSE_PROJECT_NAME), change this name to match: `docker network ls`.
    external: true
    name: compose_ae-net

volumes:
  rustfs-data:
    name: s3-rustfs-data   # exact name; without this compose prefixes the project name
